<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>myaccpj-my | Personal Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            background-color: #161b22;
            padding: 40px 30px;
            border-radius: 12px;
            border: 1px solid #30363d;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #58a6ff;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            color: #ffffff;
            font-weight: bold;
        }

        h1 {
            color: #f0f6fc;
            font-size: 24px;
            margin-bottom: 8px;
        }

        p {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            padding: 12px;
            background-color: #21262d;
            color: #58a6ff;
            text-decoration: none;
            border-radius: 6px;
            border: 1px solid #30363d;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #1f6feb;
            color: #ffffff;
            border-color: #388bfd;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Inisial Profil -->
        <div class="profile-img">M</div>
        
        <!-- Nama Akun -->
        <h1>myaccpj-my</h1>
        <p>Selamat datang di halaman resmi GitHub Pages saya.</p>
        
        <!-- Tombol Tautan (Bisa Kamu Ubah URL-nya) -->
        <div class="links">
            <a href="https://github.com" target="_blank" class="btn">GitHub Profile</a>
            <a href="#" class="btn">Portofolio Saya</a>
            <a href="#" class="btn">Hubungi Saya</a>
        </div>
    </div>

</body>
</html>
